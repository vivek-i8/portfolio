<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="cl-grad1" x1="200" y1="350" x2="200" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Stepped ascending isometric planes / knowledge stack -->
  <!-- Level 1 (Bottom foundation) -->
  <polygon points="200,320 320,260 200,200 80,260" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.04"/>
  <line x1="80" y1="260" x2="80" y2="280" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="320" y1="260" x2="320" y2="280" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="200" y1="320" x2="200" y2="340" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="200,340 320,280 200,220 80,280" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Level 2 (Mid tier) -->
  <polygon points="200,240 300,190 200,140 100,190" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1.5" fill="#6366f1" fill-opacity="0.06"/>
  <line x1="100" y1="190" x2="100" y2="205" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="300" y2="205" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="200" y1="240" x2="200" y2="255" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Level 3 (Apex tier) -->
  <polygon points="200,160 270,125 200,90 130,125" stroke="#a855f7" stroke-opacity="0.8" stroke-width="2" fill="#a855f7" fill-opacity="0.09"/>

  <!-- Infinite spiral trajectory connecting the layers -->
  <path d="M 200,320 C 350,300 340,180 200,160 C 90,145 120,70 200,50" stroke="url(#cl-grad1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/>

  <!-- Ascension beacon -->
  <circle cx="200" cy="50" r="6" fill="#a855f7"/>
  <circle cx="200" cy="50" r="14" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="200" cy="50" r="24" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Layer connector struts -->
  <line x1="200" y1="200" x2="200" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="200" y1="140" x2="200" y2="90" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="200" y1="90" x2="200" y2="50" stroke="#c084fc" stroke-width="1.5"/>
</svg>
