<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="cm-grad1" x1="50" y1="200" x2="350" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Left transmitter / source node -->
  <circle cx="100" cy="200" r="16" stroke="#06b6d4" stroke-width="2" fill="#06b6d4" fill-opacity="0.1"/>
  <circle cx="100" cy="200" r="6" fill="#06b6d4"/>

  <!-- Right receiver / sync node -->
  <circle cx="300" cy="200" r="16" stroke="#8b5cf6" stroke-width="2" fill="#8b5cf6" fill-opacity="0.1"/>
  <circle cx="300" cy="200" r="6" fill="#8b5cf6"/>

  <!-- Outward spherical wave fronts from left -->
  <path d="M 125,160 A 50 50 0 0 1 125,240" stroke="#06b6d4" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 145,135 A 80 80 0 0 1 145,265" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <path d="M 165,110 A 110 110 0 0 1 165,290" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Outward spherical wave fronts from right -->
  <path d="M 275,160 A 50 50 0 0 0 275,240" stroke="#8b5cf6" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 255,135 A 80 80 0 0 0 255,265" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <path d="M 235,110 A 110 110 0 0 0 235,290" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sinusoidal carrier signal connecting both poles -->
  <path d="M 100,200 C 130,130 170,130 200,200 C 230,270 270,270 300,200" stroke="url(#cm-grad1)" stroke-width="2" fill="none"/>
  <path d="M 100,200 C 130,270 170,270 200,200 C 230,130 270,130 300,200" stroke="url(#cm-grad1)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Central constructive interference node -->
  <circle cx="200" cy="200" r="18" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="4" fill="#3b82f6"/>
</svg>
