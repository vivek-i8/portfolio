<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="ct-grad1" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ct-beam" x1="0" y1="200" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Concentric focus rings -->
  <circle cx="200" cy="200" r="150" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="200" r="110" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="70" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="30" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Refraction prism polygon -->
  <polygon points="200,80 310,270 90,270" stroke="url(#ct-grad1)" stroke-width="2" fill="#818cf8" fill-opacity="0.05"/>
  <polygon points="200,120 280,250 120,250" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Angle measurement arcs & reticles -->
  <line x1="200" y1="30" x2="200" y2="370" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="30" y1="200" x2="370" y2="200" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Analytical refraction rays -->
  <line x1="50" y1="200" x2="200" y2="200" stroke="url(#ct-beam)" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="340" y2="120" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="200" y1="200" x2="350" y2="170" stroke="#818cf8" stroke-width="2" stroke-opacity="0.85"/>
  <line x1="200" y1="200" x2="340" y2="220" stroke="#c084fc" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="200" y1="200" x2="320" y2="270" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Inspection nodes -->
  <circle cx="200" cy="200" r="6" fill="#38bdf8"/>
  <circle cx="340" cy="120" r="4" fill="#38bdf8"/>
  <circle cx="350" cy="170" r="4" fill="#818cf8"/>
  <circle cx="340" cy="220" r="4" fill="#c084fc"/>
  <circle cx="320" cy="270" r="4" fill="#f472b6"/>
</svg>
